openapi: 3.1.0
info:
  title: Customer Support CRM - Foundation API
  version: "1.0"
  description: >
    The endpoint surface delivered by feature 001-project-foundation. It contains no business
    capability: two anonymous health endpoints and a removable reference vertical slice over
    non-business diagnostic data, present only to prove the conventions (versioning, validation,
    error contract, pagination, permission and population enforcement, correlation).
servers:
  - url: https://localhost:7001
    description: Local development

tags:
  - name: Health
    description: Anonymous operational endpoints (AR-001)
  - name: Diagnostics
    description: Reference vertical slice - removable, non-business (FR-051)

paths:
  /health/live:
    get:
      tags: [Health]
      summary: Process liveness
      security: []
      responses:
        "200":
          description: Process is running
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness, including checked dependencies
      description: >
        Reports overall status plus one entry per dependency. Never exposes connection strings,
        credentials, server names, or exception text (FR-044).
      security: []
      responses:
        "200":
          description: All dependencies healthy
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
        "503":
          description: One or more dependencies unhealthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }

  /api/v1/diagnostics/echo:
    post:
      tags: [Diagnostics]
      summary: Reference write operation demonstrating validation and permission enforcement
      description: >
        Admits Staff callers only. Requires permission `diagnostics.read`. Exists to exercise the
        validation filter and the error contract; it stores nothing.
      security:
        - staffBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EchoRequest" }
      responses:
        "200":
          description: Echoed payload
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EchoResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/diagnostics/items:
    get:
      tags: [Diagnostics]
      summary: Reference collection demonstrating the pagination contract
      description: >
        Pages over a generated in-memory sequence. No database table backs it. Sortable fields -
        `name`, `createdAt`.
      security:
        - staffBearer: []
        - portalBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: sort, in: query, schema: { type: string, examples: ["-createdAt"] } }
        - { name: nameContains, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: A page of diagnostic items
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PagedDiagnosticItems" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/UnexpectedError" }

components:
  securitySchemes:
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Staff population - token issued by the corporate identity provider.
    portalBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Portal population - token issued by the CRM for external customer accounts.

  headers:
    XCorrelationId:
      description: Correlation identifier for this request, matching the server logs.
      schema: { type: string }

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Supplied by the caller; reused rather than replaced when present (FR-041).
      schema: { type: string, maxLength: 128 }

  schemas:
    HealthReport:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [Healthy, Degraded, Unhealthy] }
        checks:
          type: array
          items:
            type: object
            required: [name, status, durationMs]
            properties:
              name: { type: string, examples: ["database"] }
              status: { type: string, enum: [Healthy, Degraded, Unhealthy] }
              durationMs: { type: number }

    EchoRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 200 }
        repeatCount: { type: integer, minimum: 1, maximum: 10, default: 1 }

    EchoResponse:
      type: object
      required: [message, receivedAt, correlationId]
      properties:
        message: { type: string }
        receivedAt: { type: string, format: date-time }
        correlationId: { type: string }

    DiagnosticItem:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }

    PagedDiagnosticItems:
      type: object
      required: [items, page, pageSize, totalCount, totalPages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DiagnosticItem" }
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer, format: int64 }
        totalPages: { type: integer }

    ProblemDetails:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string, description: "Developer-facing English. Never shown to end users." }
        status: { type: integer }
        instance: { type: string }
        code: { type: string, examples: ["validation_failed"] }
        correlationId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string, examples: ["repeatCount"] }
              code: { type: string, examples: ["range"] }
              message: { type: string }

  responses:
    ValidationFailed:
      description: Request failed validation, or was malformed or oversized
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Unauthenticated:
      description: Missing, invalid, or expired credentials
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Forbidden:
      description: Authenticated but lacking the required permission, or from a population the endpoint does not admit
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    UnexpectedError:
      description: Unhandled failure - generic message plus correlation identifier only
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
